<section class="py-16 px-6 md:px-12 lg:px-24">
  <div class="container mx-auto text-center max-w-lg">
      <h2 class="text-3xl font-bold text-gray-900 mb-4 font-serif">Create an Account</h2>
      @if(errorMessage){
        <p class="text-lg text-red-600 mb-8">{{errorMessage}}</p>
      }@else{
        <p class="text-lg text-gray-600 mb-8">Join our community of {{role}}s.</p>
      }
      <form class="space-y-4 mb-6" [formGroup]="signupForm" (ngSubmit)="onSignup()">
          <div>
              <input type="email" formControlName="email" placeholder="Email Address"
                  class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
              <div *ngIf="signupForm.controls['email'].invalid && signupForm.controls['email'].touched">
                Please enter a valid email
              </div>
          </div>
          <div>
              <input type="password" formControlName="password" placeholder="Password"
                  class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
                <div *ngIf="signupForm.controls['password'].invalid && signupForm.controls['password'].touched">
                  Password must be at least 6 characters
                </div>
          </div>
          <div>
            <input type="password" formControlName="confirmPassword" placeholder="Confirm Password"
                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
            <div *ngIf="signupForm.controls['confirmPassword'].touched && signupForm.hasError('passwordMismatch')">
              Passwords do not match
            </div>
        </div>
        <button class="hero-reader-button text-white px-8 py-3 rounded-md font-medium w-full md:w-auto" type="submit" [disabled]="signupForm.invalid || isLoading">
            {{ isLoading ? 'Creating...' : 'Sign Up' }}
        </button>
      </form>
      <p class="text-sm text-gray-500 -mt-3 mb-4">Already have an account? <button (click)="routeLogin()">[Log In]</button></p>
      <div class="signup-divider my-6"></div>
      <p class="text-sm text-gray-500 -mt-3 mb-4">Or sign up with</p>
