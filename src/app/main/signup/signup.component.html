<div class="container">
    <h2>Sign Up</h2>
    <form [formGroup]="signupForm" (ngSubmit)="onSignup()">
      <div>
        <label>Email</label>
        <input formControlName="email" type="email" />
        <div *ngIf="signupForm.controls['email'].invalid && signupForm.controls['email'].touched">
          Please enter a valid email
        </div>
      </div>
  
      <div>
        <label>Password</label>
        <input formControlName="password" type="password" />
        <div *ngIf="signupForm.controls['password'].invalid && signupForm.controls['password'].touched">
          Password must be at least 6 characters
        </div>
      </div>
  
      <div>
        <label>Confirm Password</label>
        <input formControlName="confirmPassword" type="password" />
        <div *ngIf="signupForm.controls['confirmPassword'].touched && signupForm.hasError('passwordMismatch')">
          Passwords do not match
        </div>
      </div>
  
      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>
    <p>Already have an account? <button (click)="routeLogin()">Log In</button>
    </p>
  </div>
