<section class="py-16 px-6 md:px-12 lg:px-24">
  <div class="container mx-auto text-center max-w-lg">
    <h2 class="text-3xl font-bold text-gray-900 mb-4 font-serif">{{role | titlecase}} Log in</h2>
    <p class="text-lg text-gray-600 mb-8">Join our community of {{role}}s.</p>
    <form class="space-y-4 mb-6" [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div>
        <input type="email" formControlName="email" placeholder="Email Address"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
        <div *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched">
          Email is required
        </div>
      </div>
      <div>
        <input type="password" formControlName="password" placeholder="Password"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
        <div *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched">
          Password is required
        </div>
      </div>
      <div class="flex items-center justify-center gap-2">
        <app-social-login [role]="'author'"></app-social-login>
        <button class="bg-booktok-primary-light text-white px-8 py-3 rounded-md font-medium w-full md:w-auto cursor-pointer" [disabled]="isLoading || loginForm.invalid">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </div>
    </form>
    <hr class="border-t border-gray-300 my-6">
    <div class="flex items-center justify-center gap-2">
      <button (click)="routeSignup()" class="bg-booktok-background border border-gray-300 px-4 py-1 rounded-sm font-small w-full md:w-auto cursor-pointer">Sign Up Page</button>
      <button (click)="routePasswordReset()" class="bg-booktok-background border border-gray-300 px-4 py-1 rounded-sm font-small w-full md:w-auto cursor-pointer">Reset Password</button>
    </div>
  </div>
</section>
