@if(ad){
<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 p-6 book-section">
    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-md w-full">

        <!-- Green Checkmark Icon -->
        <div class="flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mx-auto mb-4">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- Success Title -->
        <h1 class="text-4xl font-bold text-green-600 mb-4">Success!</h1>

        <!-- Ad Date -->
        <p class="text-lg text-gray-700 mb-2">Purchase is complete, if approved you're ad will be run on: <span
                class="font-semibold">{{ad.adDate | date: 'longDate'}}</span></p>

        <!-- Small Subtext -->
        <p class="text-sm text-gray-500 mb-6">You won't be charged until your ad is approved. We will notify you
            shortly!</p>

        <!-- Return Home Button -->
        <button (click)="authorPortal()"
            class="bg-booktok-accent-light hover:bg-[#5e390a] text-white font-semibold py-2 px-6 rounded-xl transition cursor-pointer">
            Return Home
        </button>
    </div>
</div>
}
