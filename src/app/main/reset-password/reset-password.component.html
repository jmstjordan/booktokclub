
<section class="py-16 px-6 md:px-12 lg:px-24">
    <div class="container mx-auto text-center max-w-lg">
        <h2 class="text-3xl font-bold text-gray-900 mb-4 font-serif">Reset Password</h2>
        <form class="space-y-4 mb-6" [formGroup]="form" (ngSubmit)="onSubmit()">
            <div>
                <input type="password" formControlName="password" placeholder="Password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
                <div *ngIf="form.controls['password'].invalid && form.controls['password'].touched">
                    Password must be at least 6 characters
                </div>
            </div>
            <div>
            <input type="password" formControlName="confirmPassword" placeholder="Confirm Password"
                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
            <div *ngIf="form.controls['confirmPassword'].touched && form.hasError('passwordMismatch')">
                Passwords do not match
            </div>
        </div>
        <button class="bg-booktok-primary-light text-white px-8 py-3 rounded-md font-medium w-full md:w-auto cursor-pointer" type="submit" [disabled]="form.invalid || isLoading">
            {{ isLoading ? 'Resetting...' : 'Reset' }}
        </button>
        <hr class="border-t border-gray-300 my-6">
        <div class="flex items-center justify-center gap-2 mt-16">
          <button (click)="home()" class="bg-booktok-background border border-gray-300 px-4 py-1 rounded-sm font-small w-full md:w-auto cursor-pointer">Home</button>
        </div>
    </form>
    </div>
</section>
