<footer class="py-12 px-6 md:px-12 lg:px-24 border-t border-gray-200 footer-bg">
    <div class="container mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
        <div>
            <div class="text-xl font-bold text-gray-900 mb-4 font-serif">BOOKTOK</div>
            <div class="flex space-x-3">
                <a target="_blank" href="https://www.tiktok.com/@booktokclub4" class="footer-social-icon" aria-label="TikTok">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="none"
                        stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M168 32a48 48 0 0 0 48 48v48a96 96 0 1 1-96-96v96a32 32 0 1 0 32 32V32z" />
                    </svg>
                </a>
                <a target="_blank" href="https://www.instagram.com/booktokusa/" class="footer-social-icon" aria-label="Instagram">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                        <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
                    </svg>
                </a>
                <a target="_blank" href="https://www.facebook.com/profile.php?id=61577331932591" class="footer-social-icon" class="footer-social-icon"  aria-label="Facebook">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                    </svg>
                </a>   
            </div>
        </div>
        <div>
            <h5 class="font-semibold text-gray-800 mb-3 uppercase text-sm tracking-wider font-serif">Resources</h5>
            <ul class="space-y-2">
                <li><a (click)="navigate('author')" class="text-gray-600 hover:text-gray-900 text-sm cursor-pointer">Author Portal</a></li>
                <li><a (click)="navigate('reader')" class="text-gray-600 hover:text-gray-900 text-sm cursor-pointer">Reader Portal</a></li>
                <li><a href="mailto:support@booktokusa.com" class="text-gray-600 hover:text-gray-900 text-sm cursor-pointer">Contact Support</a></li>
                <li><a (click)="navigate('forgot-password')" class="text-gray-600 hover:text-gray-900 text-sm cursor-pointer">Forgot Password</a></li>
            </ul>
        </div>
        <div>
            <h5 class="font-semibold text-gray-800 mb-3 uppercase text-sm tracking-wider font-serif">Join the club — free
            </h5>
            <p class="text-sm text-gray-600 mb-3">Get bestselling books, viral picks, and curated deals made for BookTok readers.</p>
            <form class="flex" [formGroup]="emailForm" (ngSubmit)="addEmail()">
                <label for="footer-email" class="sr-only">Your email</label>
                <input id="footer-email" formControlName="email" type="email" placeholder="Your email"
                class="flex-grow px-3 py-2 border border-gray-300 rounded-l-md text-sm focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
                <button type="submit" [disabled]="emailForm.invalid"
                class="newsletter-button bg-booktok-primary-light text-white px-4 py-2 mr-4 rounded-r-md text-sm font-medium cursor-pointer hover:brightness-90">Subscribe</button>
            </form>
                <p class="mt-2 mb-2 text-center"> <i>or</i> </p>
                <app-social-login [buttonText]="'Sign in with Google'" [role]="'reader'"></app-social-login>
        </div>
    </div>
    <div class="container mx-auto mt-8 pt-8 border-t border-gray-200 text-center text-sm text-gray-500">
        © 2025 BookTok. All rights reserved.
    </div>
</footer>
