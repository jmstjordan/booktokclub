<section class="py-6 px-6 md:px-6 lg:px-6">
  <div class="flex justify-center md:justify-start">
    <img src="../../../assets/logo-gpt.png" alt="Logo" class="w-24 md:w-24">
  </div>
    <div class="container mx-auto text-center max-w-lg">
      <h2 class="text-3xl font-bold text-gray-900 mb-4 font-serif">Forgot Password</h2>
      <form class="space-y-4 mb-6" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <div>
          <input type="email" formControlName="email" placeholder="Email Address"
            class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200">
          <div *ngIf="forgotPasswordForm.controls['email'].invalid && forgotPasswordForm.controls['email'].touched">
            Email is required
          </div>
        </div>
        <button class="bg-booktok-primary-light text-white px-8 py-3 rounded-md font-medium w-full md:w-auto cursor-pointer hover:brightness-90" [disabled]="isLoading || forgotPasswordForm.invalid">
          {{ isLoading ? 'Submitting...' : 'Request New Password' }}
        </button>
        @if (success) {
            <p class="text-sm text-gray-500 -mt-3 mb-4">Success! Check your email.</p>
        }
        <hr class="border-t border-gray-300 my-6">
        <div class="flex items-center justify-center gap-2 mt-16">
          <button (click)="navigate()" class="bg-booktok-background border border-gray-300 px-4 py-1 rounded-sm font-small w-full md:w-auto cursor-pointer hover:brightness-90">Log in Page</button>
        </div>
      </form>
    </div>
</section>
