<section class="py-16 px-6 md:px-12 lg:px-24 bg-gray-50">
    <div class="container mx-auto flex flex-col md:flex-row items-center gap-12">
        <div class="md:w-1/2 text-center md:text-left">
            <h1 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-4 leading-tight font-serif">Promote Your
                Book to Thousands of Readers</h1>
            <p class="text-lg text-gray-600 mb-6">Reach dedicated readers actively looking for their next
                favorite book. Advertise with us.</p>
            <button class="hero-author-button text-white px-8 py-3 rounded-md font-medium" (click)="routeSignup()">Get Started</button>
        </div>
        <div class="md:w-1/2 flex justify-center">
            <div class="relative w-64 h-64 md:w-80 md:h-80 hero-author-bg">
                <img src="https://placehold.co/300x450/EAB308/333333?text=Book+Cover" alt="Book Cover"
                    class="relative z-10 w-48 md:w-56 h-auto mx-auto shadow-lg rounded-md transform -rotate-6">
                <img src="https://placehold.co/100x100/transparent/6B7280?text=Hand+Art" alt="Hand illustration"
                    class="absolute bottom-0 right-0 z-0 w-24 h-auto opacity-30">
            </div>
        </div>
    </div>
</section>
<section class="py-16 px-6 md:px-12 lg:px-24 bg-gray-50">
    <div class="container mx-auto">
        <div class="carousel-container testimonial-carousel">
            <button class="carousel-arrow carousel-arrow-left testimonial-arrow"
                aria-label="Previous Testimonial">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-[#AD8466]">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>
            <button class="carousel-arrow carousel-arrow-right testimonial-arrow" aria-label="Next Testimonial">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-[#AD8466]">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </button>
            <div class="carousel-track flex space-x-8 pb-4 -mx-4 px-4 items-stretch justify-center">
                <div class="carousel-item w-full md:w-2/5 flex-shrink-0">
                    <div class="testimonial-card testimonial-card-orange h-full">
                        <img src="https://placehold.co/80x80/ffffff/cccccc?text=User" alt="Testimonial User 1"
                            class="testimonial-avatar">
                        <p class="testimonial-text text-lg text-gray-700 italic">"Boosted my sales by 200% in
                            one week!"</p>
                    </div>
                </div>
                <div class="carousel-item w-full md:w-2/5 flex-shrink-0">
                    <div class="testimonial-card testimonial-card-dark h-full">
                        <img src="https://placehold.co/80x80/ffffff/cccccc?text=User" alt="Testimonial User 2"
                            class="testimonial-avatar">
                        <p class="testimonial-text text-lg italic">"Wish I would have done this years ago.
                            Bravo."</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
