<section class="py-6 px-6 md:px-6 lg:px-6 min-h-screen book-section">
    <div class="flex justify-center md:justify-start">
        <img src="../../../assets/logo-gpt.png" alt="Logo" class="w-24 md:w-24">
    </div>
    <div class="container mx-auto flex flex-col md:flex-row items-center gap-12 mt-8">
        <div class="md:w-1/2 flex justify-center order-2 md:order-1">
            <div class="grid grid-cols-3 gap-4 w-full max-w-md">
                @for (product of products; track product) {
                <img [src]="product.image"
                    class="rounded shadow-md aspect-[2/3] object-cover transition-transform duration-200 hover:scale-105">
                }
            </div>
        </div>
        <div class="md:w-1/2 text-center md:text-left order-1 md:order-2">
            <h2 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-4 leading-tight font-serif">Discover Your
                Next Favorite Book</h2>
            <p class="text-lg text-gray-600 mb-6">Explore curated lists and new releases across all genres.</p>
            <form class="space-y-4 mb-6" [formGroup]="emailForm" (ngSubmit)="routeSignup()">
                <div class="flex items-center w-full gap-4">
                  <app-social-login [role]="'reader'"></app-social-login>
                  <div class="flex flex-grow">
                    <input
                      type="email"
                      formControlName="email"
                      placeholder="Email Address"
                      class="flex-grow px-4 py-3 border border-gray-300 rounded-l-md focus:ring-2 focus:ring-purple-300 focus:border-purple-500 outline-none transition duration-200"
                    />
                    <button
                      type="submit"
                      class="bg-booktok-primary-light text-white px-6 py-3 rounded-r-md font-small cursor-pointer hover:brightness-90"
                    >
                    <i class="fa-solid fa-book"></i> Join Readers
                    </button>
                  </div>
                </div>
              </form>
        </div>
    </div>
</section>
