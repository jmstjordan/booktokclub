<div
  *ngIf="toast$ | async as toast"
  class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg flex items-center gap-3
         text-white animate-fade-in transition-all duration-300"
  [ngClass]="{
    'bg-green-500': toast.type === 'success',
    'bg-red-500': toast.type === 'error',
    'bg-blue-500': toast.type === 'info'
  }"
>
  <svg *ngIf="toast.type === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
    viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
  </svg>
  <svg *ngIf="toast.type === 'error'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
    viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
  </svg>
  <svg *ngIf="toast.type === 'info'" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
    viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M12 12h.01" />
  </svg>
  <span>{{ toast.message }}</span>
</div>
