<form>
    <div *ngFor="let genre of genres">
      <label>
        <input
          type="checkbox"
          [(ngModel)]="selectedGenresMap[genre]"
          name="{{ genre }}"
        />
        {{ genre }}
      </label>
    </div>
    <button (click)="savePreferences()" class="bg-booktok-primary-light text-white px-6 py-2 rounded-md text-base font-medium" type="submit">Save</button>
</form>
