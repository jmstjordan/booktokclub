<div class="flex h-screen">
    <!-- Sidebar -->
    <div class="sidebar bg-[#E5E7EB] text-[#140900] w-64 p-4 flex flex-col border-r border-[#D1D5DB]">
        <!-- <div class="mb-8">
            <img src="https://brave-ground-05e166710.6.azurestaticapps.net/assets/logo.webp" alt="BookTok Logo" class="w-12 h-12" onerror="this.src='https://via.placeholder.com/40x40/4A3728/4A3728?text=BT'; this.onerror=null;">
        </div> -->
        <nav class="flex-1">
            <ul>
                @for (item of navItems; track item) {
                    <li class="mb-2"><a (click)="navigate(item)" class="block p-2 hover:bg-[#7163B6] rounded text-[#140900] hover:text-[#FFFFFF] leading-relaxed cursor-pointer">{{item}}</a></li>
                }
            </ul>
        </nav>
        <button class="text-sm text-[#140900] hover:text-[#7163B6] leading-relaxed">Logout</button>
    </div>
    <!-- Main Content -->
    <div class="flex-1 p-8 overflow-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-[36px] md:text-[36px] font-bold text-[#140900] font-playfair">Author Dashboard</h1>
            <div class="flex items-center">
                <span class="mr-4 text-[16px] text-[#140900] leading-relaxed">Welcome, Jane Doe!</span>
                <img src="https://ui-avatars.com/api/?name=Jane+Doe&background=AD8466&color=140900&size=40" alt="Profile" class="rounded-full">
            </div>
        </header>
        <router-outlet></router-outlet>
    </div>
</div>
